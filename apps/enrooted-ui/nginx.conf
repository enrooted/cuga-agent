# Same-pod backend. The demo adds a TLS listener using a mounted config file.
# OIDC returns a single-use code and state in the query string.
log_format enrooted_ui '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    access_log /dev/stdout enrooted_ui;
    listen 127.0.0.1:7870;
    include /etc/nginx/enrooted/*.conf;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    location /_ui/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(chat|manage|studio)(/.*)?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        gzip off;
    }
}
