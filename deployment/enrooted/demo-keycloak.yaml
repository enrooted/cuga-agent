# Render and deploy with ./demo.sh keycloak (see demo-podman.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cuga-keycloak-demo-settings
data:
  # Browser origin and Keycloak confidential client
  OIDC_CLIENT_ID: cuga-demo
  OIDC_REDIRECT_URI: https://localhost:8444/manage
  OIDC_DISCOVERY_URL: https://localhost:8543/realms/enrooted/.well-known/openid-configuration
  DYNACONF_AUTH__ENABLED: "true"
  DYNACONF_AUTH__REQUIRE_HTTPS: "true"
  DYNACONF_AUTH__OIDC_CA_BUNDLE: /run/enrooted/ca.pem
  DYNACONF_UI__ENABLED: "false"

  # OpenAI-compatible, tool-capable chat model
  AGENT_SETTING_CONFIG: settings.openai.toml
  OPENAI_BASE_URL: https://vllm.replaceme.example.com/v1
  MODEL_NAME: Qwen3.8-27B-NVFP4
  OPENAI_SSL_VERIFY: "true"
  DYNACONF_ADVANCED_FEATURES__CUGA_LITE_EXECUTION_MODE: function_calling
  DYNACONF_ADVANCED_FEATURES__TRACKER_ENABLED: "false"
  DYNACONF_ADVANCED_FEATURES__LANGFUSE_TRACING: "false"
  DYNACONF_OBSERVABILITY__OPENLIT: "false"
  OTEL_SDK_DISABLED: "true"

  # Persistent CUGA records, knowledge vectors and conversation checkpoints
  DYNACONF_STORAGE__MODE: prod
  DYNACONF_STORAGE__CHECKPOINTER: durable
  DYNACONF_STORAGE__EMBEDDING__PROVIDER: local
  CUGA_DBS_DIR: /data/dbs
  DYNACONF_KNOWLEDGE__PERSIST_DIR: /data/knowledge

  # Bundled Evolve uses the same Qwen model and a dedicated database.
  DYNACONF_SERVICE__INSTANCE_ID: cuga-keycloak-demo
  DYNACONF_EVOLVE__ENABLED: "true"
  DYNACONF_EVOLVE__MODE: direct
  DYNACONF_EVOLVE__URL: http://127.0.0.1:8201/sse
  CUGA_EMBEDDED_EVOLVE: "true"
  EVOLVE_BACKEND: postgres
  # Evolve also keeps namespace metadata locally, even with PostgreSQL vectors.
  EVOLVE_SQLITE_PATH: /data/dbs/evolve/entities.sqlite.db
  EVOLVE_PG_HOST: 127.0.0.1
  EVOLVE_PG_PORT: "5432"
  EVOLVE_PG_USER: cuga
  EVOLVE_PG_DBNAME: evolve

  # Operator-installed agent skills
  DYNACONF_SKILLS__ENABLED: "true"
  DYNACONF_SKILLS__ROOT: cuga
  CUGA_FOLDER: /data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cuga-keycloak-demo-nginx
data:
  tls.conf: |
    listen 8444 ssl;
    ssl_certificate     /run/enrooted/tls.crt;
    ssl_certificate_key /run/enrooted/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cuga-keycloak-demo-db-init
data:
  10-databases.sql: |
    \getenv app_password CUGA_DB_PASSWORD
    CREATE ROLE cuga LOGIN PASSWORD :'app_password';
    CREATE DATABASE cuga OWNER cuga;
    CREATE DATABASE evolve OWNER cuga;
    CREATE DATABASE keycloak OWNER cuga;
    \connect cuga
    CREATE EXTENSION IF NOT EXISTS vector;
    \connect evolve
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cuga-keycloak-demo-skill
data:
  SKILL.md: |
    ---
    name: meeting-summary
    description: Turn supplied meeting notes into a concise summary and action list.
    ---
    Summarize the decisions in the user's notes. List action items with owners
    and due dates where supplied. Ask about missing details before assigning them.
---
# Podman maps PVCs to named volumes. The API runs as UID 1001.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cuga-keycloak-demo-postgres
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cuga-keycloak-demo-data
  annotations: {volume.podman.io/uid: "1001", volume.podman.io/gid: "0"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: cuga-keycloak-demo-pod
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: docker.io/pgvector/pgvector:pg16
      args: [postgres, -c, listen_addresses=127.0.0.1]
      envFrom:
        - secretRef: {name: cuga-keycloak-demo-db-credentials}
      volumeMounts:
        - {name: pgdata, mountPath: /var/lib/postgresql/data}
        - {name: db-init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}

    - name: api
      image: quay.io/enrooted/cuga-api:demo
      imagePullPolicy: Always
      envFrom:
        - configMapRef: {name: cuga-keycloak-demo-settings}
        - secretRef: {name: cuga-keycloak-demo-api-credentials}
      volumeMounts:
        - {name: data, mountPath: /data}
        - {name: skill, mountPath: /data/skills/meeting-summary, readOnly: true}
        - {name: trust, mountPath: /run/enrooted, readOnly: true}

    - name: ui
      image: quay.io/enrooted/cuga-ui:demo
      imagePullPolicy: Always
      ports:
        - {name: https, containerPort: 8444, hostPort: 8444, hostIP: 127.0.0.1}
      volumeMounts:
        - {name: https, mountPath: /etc/nginx/enrooted, readOnly: true}
        - {name: tls, mountPath: /run/enrooted, readOnly: true}

    - name: keycloak
      image: quay.io/keycloak/keycloak:26.7
      args:
        - start-dev
        - --import-realm
        - --http-enabled=false
        - --hostname=https://localhost:8543
        - --https-port=8543
        - --https-certificate-file=/tls/tls.crt
        - --https-certificate-key-file=/tls/tls.key
      ports:
        - {name: identity, containerPort: 8543, hostPort: 8543, hostIP: 127.0.0.1}
      env:
        - {name: KC_DB, value: postgres}
        - {name: KC_DB_URL, value: 'jdbc:postgresql://127.0.0.1:5432/keycloak'}
        - {name: KC_DB_USERNAME, value: cuga}
        - name: KC_DB_PASSWORD
          valueFrom: {secretKeyRef: {name: cuga-keycloak-demo-db-credentials, key: CUGA_DB_PASSWORD}}
      volumeMounts:
        - {name: tls, mountPath: /tls, readOnly: true}
        - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}

  volumes:
    - {name: pgdata, persistentVolumeClaim: {claimName: cuga-keycloak-demo-postgres}}
    - {name: data, persistentVolumeClaim: {claimName: cuga-keycloak-demo-data}}
    - {name: db-init, configMap: {name: cuga-keycloak-demo-db-init}}
    - {name: https, configMap: {name: cuga-keycloak-demo-nginx}}
    - {name: trust, secret: {secretName: cuga-keycloak-demo-trust}}
    - {name: tls, secret: {secretName: cuga-keycloak-demo-tls}}
    - {name: skill, configMap: {name: cuga-keycloak-demo-skill}}
    - {name: realm, secret: {secretName: cuga-keycloak-demo-realm}}
